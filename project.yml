name: ForgeIPA
options:
  bundleIdPrefix: com.forgeipa
  deploymentTarget:
    iOS: "16.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
targets:
  ForgeIPA:
    type: application
    platform: iOS
    sources:
      - path: ForgeIPA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forgeipa.app
        PRODUCT_NAME: Forge IPA
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Forge IPA
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
