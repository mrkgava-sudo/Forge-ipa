name: Build Forge IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ForgeIPA/**"
      - "project.yml"
      - ".github/workflows/build.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Render app icon
        run: |
          mkdir -p ForgeIPA/Assets.xcassets/AppIcon.appiconset
          swift scripts/render-icon.swift
      - name: Build unsigned app
        run: |
          xcodebuild -project ForgeIPA.xcodeproj -scheme ForgeIPA -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Forge IPA.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry Forge-IPA-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Forge-IPA-unsigned
          path: Forge-IPA-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
